<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4a6cf7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./app-icon.svg">
    <title>AI学习工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #f0f2f5; --card-bg: #fff; --text: #1a1a2e; --text-secondary: #888;
            --border: #eee; --shadow: rgba(0,0,0,0.06); --primary: #4a6cf7;
            --primary-light: #eef3ff; --success: #28a745; --danger: #ff6b6b; --warning: #ffc107;
            --font-size: 16px; --radius: 16px; --transition: all 0.3s ease;
        }
        .dark-mode {
            --bg: #1a1a2e; --card-bg: #2a2a3e; --text: #e8e8f0; --text-secondary: #aaa;
            --border: #3a3a4e; --shadow: rgba(0,0,0,0.3); --primary-light: #2a2a4e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); padding-bottom: 70px;
            min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 70px);
            transition: var(--transition); font-size: var(--font-size);
        }
        #app {
            max-width: 460px; margin: 0 auto; background: var(--bg);
            min-height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            transition: var(--transition);
        }
        .page-content { flex: 1; padding: 12px 12px 0; overflow: hidden; display: flex; flex-direction: column; }
        .page { display: none; flex: 1; overflow: hidden; }
        .page.active { display: flex; flex-direction: column; }

        /* ===== 启动画面 ===== */
        #splash-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #4a6cf7; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.6s ease; color: #fff;
        }
        #splash-screen.hidden { opacity: 0; pointer-events: none; }
        #splash-screen .splash-icon { font-size: 64px; margin-bottom: 16px; animation: bounce 1.2s ease infinite; }
        #splash-screen .splash-title { font-size: 24px; font-weight: 700; letter-spacing: 2px; }
        #splash-screen .splash-sub { font-size: 14px; opacity: 0.7; margin-top: 8px; }
        @keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            height: 60px; max-width: 460px; margin: 0 auto; z-index: 100;
            box-shadow: 0 -2px 10px var(--shadow); flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom, 0);
            transition: var(--transition);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; padding: 4px 12px; flex: 1;
            border: none; background: none; font-family: inherit;
            border-radius: 8px; transition: background 0.15s;
            color: var(--text-secondary);
        }
        .nav-item:active { transform: scale(0.95); }
        .nav-item .nav-icon { font-size: 22px; line-height: 1.2; }
        .nav-item .nav-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; transition: var(--transition); }
        .nav-item.active .nav-label { color: var(--primary); font-weight: 600; }

        /* ===== 通用卡片 ===== */
        .card {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px 18px;
            margin-bottom: 14px; box-shadow: 0 2px 8px var(--shadow);
            transition: var(--transition);
        }
        .card:active { transform: scale(0.98); }
        .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .header { text-align: center; padding: 20px 0 12px 0; }
        .header h1 { font-size: 26px; font-weight: 700; color: var(--text); }
        .subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

        /* ===== 首页布局 ===== */
        .home-layout {
            display: flex; flex: 1; min-height: 0; gap: 0;
            background: var(--card-bg); border-radius: var(--radius); overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow);
            transition: var(--transition);
        }
        .home-sidebar {
            width: 56px; background: var(--bg);
            display: flex; flex-direction: column; align-items: center;
            padding: 8px 0; flex-shrink: 0; overflow-y: auto; gap: 4px;
            transition: var(--transition);
        }
        .home-sidebar .sidebar-item {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 18px; cursor: pointer;
            transition: all 0.15s; border: none; background: transparent;
            color: var(--text-secondary); font-family: inherit; padding: 0;
        }
        .home-sidebar .sidebar-item:active { transform: scale(0.9); background: var(--border); }
        .home-sidebar .sidebar-item .s-label { font-size: 9px; margin-top: 2px; color: var(--text-secondary); font-weight: 500; }
        .home-sidebar .sidebar-item.active { background: var(--primary-light); color: var(--primary); }
        .home-sidebar .sidebar-item.active .s-label { color: var(--primary); }
        .home-content {
            flex: 1; padding: 14px 16px; overflow-y: auto;
            background: var(--card-bg); min-width: 0;
            transition: var(--transition);
        }
        .home-content .section-title {
            font-size: 16px; font-weight: 600; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
            color: var(--text);
        }

        /* ===== 统计看板 ===== */
        .stats-dashboard {
            display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 14px;
        }
        .stats-dashboard .stat-item {
            background: var(--bg); border-radius: 12px; padding: 12px;
            text-align: center; transition: var(--transition);
        }
        .stats-dashboard .stat-item .stat-number {
            font-size: 24px; font-weight: 700; color: var(--primary); display: block;
        }
        .stats-dashboard .stat-item .stat-label {
            font-size: 12px; color: var(--text-secondary); display: block; margin-top: 2px;
        }
        .stats-dashboard .stat-item .stat-number.green { color: var(--success); }
        .stats-dashboard .stat-item .stat-number.orange { color: #e67e22; }

        /* ===== 进度条 ===== */
        .progress-bar-wrap {
            background: var(--bg); border-radius: 20px; height: 8px; overflow: hidden; margin-bottom: 12px;
            transition: var(--transition);
        }
        .progress-bar-wrap .progress-fill {
            height: 100%; border-radius: 20px;
            background: linear-gradient(90deg, #4a6cf7, #6f8cff);
            transition: width 0.6s ease;
            width: 0%;
        }
        .progress-label {
            display: flex; justify-content: space-between; font-size: 13px;
            color: var(--text-secondary); margin-bottom: 6px;
        }

        /* ===== 今日状态 ===== */
        .status-grid { display: flex; gap: 10px; }
        .status-item {
            flex: 1; background: var(--bg); border-radius: 8px; padding: 10px; text-align: center;
            transition: var(--transition);
        }
        .status-item .label { font-size: 11px; color: var(--text-secondary); display: block; }
        .status-item .value { font-size: 18px; font-weight: 700; color: var(--primary); margin-top: 2px; display: block; }

        /* ===== 计划 ===== */
        .story-block {
            background: linear-gradient(135deg, var(--primary-light), var(--bg));
            border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
            border-left: 4px solid var(--primary);
            transition: var(--transition);
        }
        .story-block .story-label { font-size: 12px; color: var(--primary); font-weight: 600; margin-bottom: 4px; }
        .story-block .story-text { font-size: 14px; color: var(--text); line-height: 1.6; }
        .day-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 8px 0; border-bottom: 2px solid var(--border);
        }
        .day-header .day-title { font-size: 16px; font-weight: 700; color: var(--primary); }
        .day-header .day-progress { font-size: 13px; color: var(--text-secondary); }
        .day-header .day-progress .done-count { color: var(--success); font-weight: 600; }

        .plan-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; font-size: 13px; border-radius: 10px;
            margin-bottom: 8px; background: var(--bg);
            transition: all 0.15s; border-left: 3px solid transparent;
            cursor: pointer;
        }
        .plan-item:active { transform: scale(0.98); }
        .plan-item .plan-left { flex: 1; min-width: 0; }
        .plan-item .plan-title {
            font-weight: 500; font-size: 14px;
            display: flex; align-items: center; gap: 6px; color: var(--text);
        }
        .plan-item .plan-title .type-badge {
            font-size: 11px; padding: 1px 8px; border-radius: 10px;
            font-weight: 600; flex-shrink: 0;
        }
        .type-badge.学 { background: var(--primary-light); color: var(--primary); }
        .type-badge.练 { background: #fff3cd; color: #856404; }
        .type-badge.复 { background: #d4edda; color: #155724; }
        .type-badge.休 { background: #f8d7da; color: #721c24; }
        .plan-item .plan-title.done { text-decoration: line-through; color: var(--text-secondary); }
        .plan-item .plan-title .overdue-badge {
            font-size: 10px; background: var(--danger); color: #fff;
            padding: 1px 8px; border-radius: 10px; font-weight: 600;
            flex-shrink: 0;
        }
        .plan-item .plan-meta {
            font-size: 12px; color: var(--text-secondary); margin-top: 2px;
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .plan-item .plan-meta .teacher { color: var(--primary); }
        .plan-item .plan-meta .platform { background: var(--primary-light); padding: 0 8px; border-radius: 10px; }
        .plan-item .plan-meta .time-slot { color: var(--text-secondary); }
        .plan-item .plan-meta .plan-link { color: var(--primary); text-decoration: none; font-size: 12px; }
        .plan-item .plan-meta .plan-link:active { opacity: 0.7; }
        .plan-item .task-btn {
            background: var(--primary-light); border: none; border-radius: 12px;
            padding: 4px 14px; font-size: 12px; color: var(--primary);
            cursor: pointer; flex-shrink: 0; margin-left: 8px;
            transition: all 0.15s; font-weight: 500;
        }
        .plan-item .task-btn:active { transform: scale(0.9); }
        .plan-item .task-btn.done-btn {
            background: #d4edda; color: #155724;
        }
        .plan-item.completed { background: #d4edda; border-left-color: var(--success); }

        .day-complete-bar {
            margin-top: 14px; padding: 12px 16px; border-radius: 12px;
            text-align: center; font-weight: 600; font-size: 14px;
        }
        .day-complete-bar.done { background: #d4edda; color: #155724; }
        .day-complete-bar.pending { background: #fff3cd; color: #856404; }

        /* ===== 任务备注弹窗 ===== */
        .note-icon { font-size: 14px; cursor: pointer; opacity: 0.5; transition: 0.2s; margin-left: 6px; }
        .note-icon:hover { opacity: 1; }
        .note-icon.has-note { opacity: 1; color: var(--primary); }
        .modal-content .note-input {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; font-family: inherit;
            background: var(--bg); color: var(--text); transition: var(--transition);
        }

        /* ===== 学习报告弹窗 ===== */
        .report-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: flex;
            justify-content: center; align-items: center; z-index: 2000;
            animation: fadeIn 0.3s ease;
        }
        .report-box {
            background: var(--card-bg); border-radius: 24px; padding: 28px 24px;
            max-width: 380px; width: 92%; max-height: 80vh; overflow-y: auto;
            animation: bounceIn 0.5s ease;
            transition: var(--transition);
            box-shadow: 0 12px 48px rgba(0,0,0,0.2);
        }
        .report-box .report-header { text-align: center; margin-bottom: 16px; }
        .report-box .report-header .report-icon { font-size: 48px; display: block; margin-bottom: 4px; }
        .report-box .report-header .report-title { font-size: 20px; font-weight: 700; color: var(--text); }
        .report-box .report-header .report-date { font-size: 13px; color: var(--text-secondary); }
        .report-box .report-phase {
            font-size: 13px; color: var(--primary); font-weight: 600;
            background: var(--primary-light); padding: 4px 14px;
            border-radius: 20px; display: inline-block; margin-bottom: 12px;
        }
        .report-box .report-topic { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
        .report-box .report-progress {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 14px; padding: 10px 14px;
            background: var(--bg); border-radius: 12px;
        }
        .report-box .report-progress .ring { width: 48px; height: 48px; flex-shrink: 0; }
        .report-box .report-progress .ring svg { transform: rotate(-90deg); }
        .report-box .report-progress .ring .bg { fill: none; stroke: var(--border); }
        .report-box .report-progress .ring .fill { fill: none; stroke: var(--success); stroke-linecap: round; transition: stroke-dasharray 0.6s ease; }
        .report-box .report-progress .ring .fill.partial { stroke: var(--warning); }
        .report-box .report-progress .ring .fill.low { stroke: var(--danger); }
        .report-box .report-progress .info { flex: 1; }
        .report-box .report-progress .info .label { font-size: 12px; color: var(--text-secondary); }
        .report-box .report-progress .info .value { font-size: 18px; font-weight: 700; color: var(--text); }
        .report-box .report-tasks { margin: 12px 0 14px 0; }
        .report-box .report-tasks .task-row {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 0; font-size: 13px; color: var(--text);
            border-bottom: 1px solid var(--border);
        }
        .report-box .report-tasks .task-row:last-child { border-bottom: none; }
        .report-box .report-tasks .task-row .t-badge {
            font-size: 10px; padding: 1px 8px; border-radius: 10px;
            font-weight: 600; flex-shrink: 0;
        }
        .report-box .report-tasks .task-row .t-badge.学 { background: var(--primary-light); color: var(--primary); }
        .report-box .report-tasks .task-row .t-badge.练 { background: #fff3cd; color: #856404; }
        .report-box .report-tasks .task-row .t-badge.复 { background: #d4edda; color: #155724; }
        .report-box .report-tasks .task-row .t-badge.休 { background: #f8d7da; color: #721c24; }
        .report-box .report-tasks .task-row .t-check { color: var(--success); font-size: 16px; flex-shrink: 0; }
        .report-box .report-stats {
            display: flex; gap: 8px; margin: 12px 0 16px 0;
        }
        .report-box .report-stats .stat {
            flex: 1; background: var(--bg); border-radius: 10px;
            padding: 8px 6px; text-align: center;
        }
        .report-box .report-stats .stat .num {
            font-size: 18px; font-weight: 700; display: block; color: var(--primary);
        }
        .report-box .report-stats .stat .lbl { font-size: 11px; color: var(--text-secondary); }
        .report-box .report-stats .stat .num.green { color: var(--success); }
        .report-box .report-stats .stat .num.orange { color: #e67e22; }
        .report-box .report-encourage {
            text-align: center; font-size: 14px; color: var(--text-secondary);
            padding: 10px 0; border-top: 1px solid var(--border);
            margin-bottom: 12px; line-height: 1.6;
        }
        .report-box .report-encourage strong { color: var(--primary); }
        .report-box .report-actions {
            display: flex; gap: 12px; justify-content: center;
        }
        .report-box .report-actions button {
            padding: 8px 28px; border: none; border-radius: 24px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.15s;
        }
        .report-box .report-actions button:active { transform: scale(0.95); }
        .report-box .report-actions .btn-close-report { background: var(--primary); color: #fff; }

        /* ===== 完成动画 ===== */
        .celebrate-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); display: flex;
            justify-content: center; align-items: center; z-index: 1999;
            animation: fadeIn 0.3s ease;
        }
        .celebrate-box {
            background: var(--card-bg); border-radius: 24px; padding: 32px 40px;
            text-align: center; animation: bounceIn 0.5s ease;
            max-width: 320px;
        }
        .celebrate-box .big-icon { font-size: 64px; display: block; margin-bottom: 12px; }
        .celebrate-box .msg { font-size: 20px; font-weight: 700; color: var(--text); }
        .celebrate-box .sub-msg { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== 复盘汇总 ===== */
        .review-list { display: flex; flex-direction: column; gap: 10px; }
        .review-item {
            background: var(--bg); border-radius: 12px; padding: 12px 14px;
            cursor: pointer; transition: all 0.15s;
            border-left: 3px solid var(--primary);
        }
        .review-item:active { transform: scale(0.97); background: var(--primary-light); }
        .review-item .review-date {
            font-size: 13px; font-weight: 600; color: var(--primary);
            display: flex; justify-content: space-between; align-items: center;
        }
        .review-item .review-date .review-badge {
            font-size: 10px; background: var(--primary); color: #fff;
            padding: 1px 10px; border-radius: 12px; font-weight: 400;
        }
        .review-item .review-preview {
            font-size: 14px; color: var(--text-secondary); margin-top: 4px;
            line-height: 1.5; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .review-empty { text-align: center; color: var(--text-secondary); padding: 30px 0; }
        .review-empty .big-icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .btn-add-review {
            display: block; width: 100%; padding: 10px;
            border: 2px dashed var(--primary); border-radius: 12px;
            background: transparent; color: var(--primary);
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.15s;
            margin-top: 12px;
        }
        .btn-add-review:active { transform: scale(0.97); background: var(--primary-light); }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        .modal-content {
            background: var(--card-bg); border-radius: 20px; padding: 24px;
            width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;
            animation: slideUp 0.3s ease;
            transition: var(--transition);
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-content h3 { margin-bottom: 12px; font-size: 18px; color: var(--text); }
        .modal-content .modal-date { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
        .modal-content textarea {
            width: 100%; height: 120px; border: 1px solid var(--border);
            border-radius: 10px; padding: 10px; font-size: 14px;
            resize: vertical; font-family: inherit;
            background: var(--bg); color: var(--text);
            transition: var(--transition);
        }
        .modal-actions {
            display: flex; gap: 12px; margin-top: 16px; justify-content: flex-end;
        }
        .modal-actions button {
            padding: 8px 20px; border: none; border-radius: 20px;
            font-size: 14px; cursor: pointer; font-family: inherit;
            transition: all 0.15s;
        }
        .modal-actions button:active { transform: scale(0.95); }
        .modal-actions button:first-child { background: var(--primary); color: #fff; }
        .modal-actions button:last-child { background: var(--bg); color: var(--text); }
        .modal-actions button.danger { background: var(--danger); color: #fff; }

        /* ===== 时间选择器 ===== */
        .time-picker { display: flex; gap: 20px; justify-content: center; margin: 16px 0; }
        .picker-col { display: flex; flex-direction: column; align-items: center; }
        .picker-col label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .picker-col select {
            font-size: 20px; padding: 8px 12px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); width: 70px; text-align: center;
            font-family: inherit; transition: var(--transition);
        }

        /* ===== 成长页 ===== */
        .sub-tabs {
            display: flex; gap: 8px; margin-bottom: 12px;
            overflow-x: auto; padding-bottom: 4px; flex-shrink: 0;
        }
        .sub-tabs button {
            flex-shrink: 0; padding: 6px 14px; border: none;
            border-radius: 20px; background: var(--bg); font-size: 13px;
            cursor: pointer; font-family: inherit; transition: all 0.15s;
            color: var(--text-secondary);
        }
        .sub-tabs button:active { transform: scale(0.95); }
        .sub-tabs button.active { background: var(--primary); color: #fff; }
        .sub-content {
            background: var(--card-bg); border-radius: var(--radius); padding: 14px;
            flex: 1; overflow-y: auto; min-height: 0;
            transition: var(--transition);
        }
        .filter-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
        .filter-btn {
            padding: 3px 12px; border: 1px solid var(--border); border-radius: 14px;

                try { const v = localStorage.getItem('sw_' + key); return v ? JSON.parse(v) : def; } catch { return def; }
            },
            set(key, val) {
                try { localStorage.setItem('sw_' + key, JSON.stringify(val)); return true; }
                catch { return false; }
            }
        };

        // ============================================================
        // 启动画面
        // ============================================================
        setTimeout(() => { document.getElementById('splash-screen').classList.add('hidden'); }, 800);

        // ============================================================

            btn.addEventListener('click', function() {

                const tab = this.dataset.tab;
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + tab).classList.add('active');
                if (tab === 'home') renderHome();
                if (tab === 'growth') renderGrowth();
                if (tab === 'insight') renderInsight();
                if (tab === 'review') renderReview();
                if (tab === 'my') renderMy();
            });
        });

        // 工具函数

            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function getWeekday() {
            const ws = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            return ws[new Date().getDay()];
        }
        function formatDate(d) {
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        // 设置

        function syncPlan() {
            const savedPlan = Store.get('plan', null);
            if (!savedPlan || savedPlan.length !== FULL_PLAN.length) {
                homeState.plan = FULL_PLAN.map((day, idx) => {
                    const savedDay = savedPlan && savedPlan[idx] ? savedPlan[idx] : null;
                    return {
                        ...day,
                        tasks: day.tasks.map((task, taskIdx) => {
                            if (savedDay && savedDay.tasks && savedDay.tasks[taskIdx]) {
                                return { ...task, done: savedDay.tasks[taskIdx].done || false };
                            }
                            return { ...task, done: false };
                        })
                    };
                });
                Store.set('plan', homeState.plan);
            } else {
                homeState.plan = savedPlan;
            }
            if (homeState.currentDayIndex >= homeState.plan.length) {
                homeState.currentDayIndex = homeState.plan.length - 1;
                Store.set('currentDayIndex', homeState.currentDayIndex);

            homeState.level = Math.min(Math.floor(homeState.continuousDays / 20) + 1, 10);

                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    const daysInPrev = new Date(year, month, 0).getDate();
                    let calDays = [];
                    for (let i = firstDay - 1; i >= 0; i--) {
                        const d = daysInPrev - i;
                        const dateStr = year + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                        calDays.push({ day: d, isCurrent: false, date: dateStr, minutes: records[dateStr] || 0 });
                    }
                    for (let d = 1; d <= daysInMonth; d++) {
                        const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                        calDays.push({ day: d, isCurrent: true, date: dateStr, minutes: records[dateStr] || 0 });
                    }
                    const total = 42;
                    const remaining = total - calDays.length;
                    for (let d = 1; d <= remaining; d++) {
                        const nextMonth = month + 1;
                        const ny = nextMonth === 12 ? year + 1 : year;
                        const nm = nextMonth === 12 ? 0 : nextMonth;
                        const dateStr = ny + '-' + String(nm + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                        calDays.push({ day: d, isCurrent: false, date: dateStr, minutes: 0 });
                    }
                    const chartData = [];
                    for (let i = 6; i >= 0; i--) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        const key = formatDate(d);
                        chartData.push({ label: (d.getMonth() + 1) + '/' + d.getDate(), value: records[key] || 0 });
                    }
                    const maxVal = Math.max(...chartData.map(d => d.value), 1);
                    const pad = 10,
                        w = 280,
                        h = 80;
                    const step = w / (chartData.length - 1);
                    const pts = chartData.map((d, i) => {
                        const x = pad + i * step;
                        const y = pad + h - (d.value / maxVal) * h;
                        return x + ',' + y;
                    }).join(' ');

                            <span style="font-size:12px;color:var(--text-secondary);">点击日期打卡</span>

                            ${calDays.map(d => `
                                <div class="day ${!d.isCurrent ? 'other' : ''} ${d.minutes > 0 ? 'has' : ''}" style="text-align:center;font-size:12px;padding:4px 0;border-radius:6px;background:${d.minutes>0?'var(--primary-light)':'var(--bg)'};color:${d.minutes>0?'var(--primary)':'var(--text-secondary)'};cursor:pointer;transition:all 0.15s;" onclick="openTimePicker('${d.date}')">
                                    ${d.day}
                                    ${d.minutes > 0 ? `<span style="font-size:8px;display:block;color:var(--primary);">${d.minutes}m</span>` : ''}
                                </div>
                            `).join('')}
                        </div>
                        <div style="margin-top:8px;font-size:12px;color:var(--text-secondary);">总学习时长：${Object.values(records).reduce((a,b)=>a+b,0)} 分钟</div>
                        <div style="margin-top:10px;">
                            <svg viewBox="0 0 320 100" style="width:100%;height:auto;">
                                <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>
                                ${chartData.map((d,i) => {
                                    const x = pad + i * step;
                                    const y = pad + h - (d.value / maxVal) * h;
                                    return `<circle cx="${x}" cy="${y}" r="3" fill="var(--primary)"/>`;
                                }).join('')}
                                ${chartData.map((d,i) => {
                                    const x = pad + i * step;
                                    return `<text x="${x}" y="95" font-size="8" fill="var(--text-secondary)" text-anchor="middle">${d.label}</text>`;
                                }).join('')}
                            </svg>
                        </div>
                    `;
                    break;
                }
            }

            el.innerHTML = `
                <div class="home-layout">
                    <div class="home-sidebar">${sidebarHTML}</div>
                    <div class="home-content">${contentHTML}</div>
                </div>
            `;
        }

        // ===== 首页交互函数 =====
        window.switchHomeTab = function(key) { homeTab = key;
            renderHome(); };

        function agentToolReadProgress() {
            const allTasks = homeState.plan.reduce((total, day) => total + day.tasks.length, 0);
            const completedTasks = homeState.plan.reduce((total, day) => total + day.tasks.filter(task => task.done).length, 0);
            return { day: homeState.currentDayIndex + 1, totalDays: homeState.plan.length, rate: allTasks ? Math.round(completedTasks / allTasks * 100) : 0 };
        }

        function agentToolFindWeakPoints() {
            return homeState.errors.filter(error => !error.mastered).slice(0, 3).map(error => error.text);
        }

        function agentToolGetTodayTasks() {
            const day = homeState.plan[homeState.currentDayIndex];
            return day ? day.tasks.filter(task => !task.done).slice(0, 3) : [];
        }

        function agentToolBuildPlan(goal, progress, weakPoints, todayTasks) {
            const plan = [];
            if (weakPoints.length) {
                plan.push({ title: '优先复习薄弱点', detail: `复习：${weakPoints.join('、')}，每个知识点写出一个例子或面试回答。` });
            }
            todayTasks.slice(0, 2).forEach(task => {
                plan.push({ title: `完成今日任务：${task.text}`, detail: `建议安排 ${task.time}，完成后记录一条复盘。` });
            });
            if (!todayTasks.length) {
                plan.push({ title: '回顾当前阶段', detail: `你正在第 ${progress.day} / ${progress.totalDays} 天，今天可以整理阶段笔记并补充项目代码。` });
            }
            plan.push({ title: '形成可验证输出', detail: `围绕“${goal}”产出一段代码、一张架构图或一条复盘记录，不只停留在阅读。` });
            return plan.slice(0, 4);
        }

        const agentTools = {
            readProgress: {
                label: '读取学习进度',
                run: () => agentToolReadProgress()
            },
            findWeakPoints: {
                label: '分析薄弱点',
                run: () => agentToolFindWeakPoints()
            },
            getTodayTasks: {
                label: '读取今日任务',
                run: () => agentToolGetTodayTasks()
            },
            buildPlan: {
                label: '生成执行计划',
                run: ({ goal, progress, weakPoints, todayTasks }) => agentToolBuildPlan(goal, progress, weakPoints, todayTasks)
            },
            addPlanTask: {
                label: '写入今日计划',
                run: ({ title }) => {
                    const day = homeState.plan[homeState.currentDayIndex];
                    if (!day) return false;
                    day.tasks.push({ id: `agent-${Date.now()}`, text: title, type: '练', time: '20:30-21:00', done: false, teacher: '学习智能体', platform: '本地', link: '' });
                    Store.set('plan', homeState.plan);
                    return true;
                }
            },
            readMemory: {
                label: '读取长期记忆',
                run: () => agentState.memory.slice(0, 5)
            },
            saveMemory: {
                label: '保存长期记忆',
                run: ({ memory }) => {
                    agentState.memory = [memory].concat(agentState.memory).slice(0, 20);
                    Store.set('agentMemory', agentState.memory);
                    return true;
                }
            }
        };

        function runAgentTool(name, input, logs) {
            const tool = agentTools[name];
            if (!tool) throw new Error(`未知工具：${name}`);
            const output = tool.run(input);
            logs.push(`${tool.label}：完成`);
            return output;
        }

        window.applyAgentPlanStep = function(index) {
            const result = agentState.result;
            const item = result && result.plan[index];
            if (!item || (result.applied && result.applied[index])) return;
            if (!confirm(`确定将“${item.title}”加入今天的学习计划吗？`)) return;
            const logs = [];
            const added = runAgentTool('addPlanTask', { title: item.title }, logs);
            if (!added) { alert('当前没有可用的学习日计划'); return; }
            result.applied = result.applied || {};
            result.applied[index] = true;
            result.logs = (result.logs || []).concat(logs);
            Store.set('agentLastResult', result);
            renderHome();
        };

        window.runLearningAgent = function() {
            const input = document.getElementById('agentGoalInput');
            const goal = input ? input.value.trim() : agentState.goal;
            if (!goal) { alert('请先输入学习目标'); return; }
            agentState.goal = goal;
            agentState.running = true;
            Store.set('agentGoal', goal);
            renderHome();
            setTimeout(() => {
                const logs = [];
                const previousMemory = runAgentTool('readMemory', null, logs);
                logs[logs.length - 1] += `（${previousMemory.length} 条）`;
                const progress = runAgentTool('readProgress', null, logs);
                logs[logs.length - 1] += `（第 ${progress.day} 天，完成率 ${progress.rate}%）`;
                const weakPoints = runAgentTool('findWeakPoints', null, logs);
                logs[logs.length - 1] += `（${weakPoints.length ? weakPoints.join('、') : '当前没有未掌握错题'}）`;
                const todayTasks = runAgentTool('getTodayTasks', null, logs);
                logs[logs.length - 1] += `（${todayTasks.length} 项待完成）`;
                const plan = runAgentTool('buildPlan', { goal, progress, weakPoints, todayTasks }, logs);
                logs[logs.length - 1] += `（${plan.length} 个步骤）`;
                const memory = `用户当前关注“${goal}”，下次优先检查 ${weakPoints[0] || '今日任务完成情况'}`;
                runAgentTool('saveMemory', { memory }, logs);
                agentState.result = { summary: `已为你生成 ${plan.length} 步学习计划`, plan, logs, memory };
                agentState.logs = [{ time: new Date().toISOString(), goal, logs }].concat(agentState.logs).slice(0, 20);
                agentState.running = false;
                Store.set('agentLastResult', agentState.result);
                Store.set('agentLogs', agentState.logs);
                Store.set('agentMemory', agentState.memory);
                renderHome();
            }, 180);
        };

            const task = day.tasks[taskIdx];
            const wasDone = task.done;
            task.done = !task.done;
            Store.set('plan', homeState.plan);
            renderHome();
            if (task.done && !wasDone) {
                // 检查是否全部完成
                const allDone = day.tasks.every(t => t.done);
                if (allDone) {
                    // 全部完成则弹出学习报告
                    showDailyReport();
                } else {
                    showCelebration();
                }
            }
        };

                difficulty: '困难' }

        // ============================================================
        // 成长页
        // ============================================================
        let growthState = {
            subTab: 'interview',
            searchKeyword: '',
            selectedCategory: '全部',
            expandedId: null,
            mode: 'browse',
            examStarted: false,
            examFinished: false,
            examQuestions: [],
            currentIndex: 0,
            correctCount: 0,
            wrongCount: 0,
            wrongQuestions: [],
            showAnswer: false,
            errorFilter: 'all',
            errorCategoryFilter: '全部',
            trendFilter: '全部',
            trendView: 'all',
            trendTime: 'all',
            trendRole: '全部岗位',
            trendType: '全部题型'
        };

        const NEWS_CACHE_KEY = 'aiNewsCache';
        const NEWS_FEEDS = [
            { name: 'Hugging Face', url: 'https://huggingface.co/blog/feed.xml', category: '开源模型' },
            { name: 'Google AI', url: 'https://blog.google/technology/ai/rss/', category: '产品发布' },
            { name: 'arXiv AI', url: 'https://export.arxiv.org/rss/cs.AI', category: '论文研究' },
            { name: 'GitHub Blog', url: 'https://github.blog/feed/', category: '开发趋势' }
        ];
        const FALLBACK_NEWS = [
            { title: '关注多模态模型的能力边界与评测方法', summary: '从视觉理解、工具调用和长上下文三个角度，整理近期模型能力变化。', source: 'AI学习工作台', category: '模型能力', publishedAt: new Date().toISOString(), url: 'https://arxiv.org/list/cs.AI/recent' },
            { title: '开源模型部署成本正在成为工程面试重点', summary: '量化、KV Cache、批处理和推理服务优化，是近期值得持续跟踪的工程主题。', source: 'AI学习工作台', category: '工程实践', publishedAt: new Date().toISOString(), url: 'https://huggingface.co/models' }
        ];
        let newsState = { items: Store.get(NEWS_CACHE_KEY, FALLBACK_NEWS), loading: false, error: '', loaded: false, updatedAt: Store.get('aiNewsUpdatedAt', ''), failedSources: [] };
        let newsMarks = Store.get('aiNewsMarks', { read: {}, saved: {} });
        let trendMastery = Store.get('aiTrendMastery', {});

        function formatNewsDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '时间未知' : date.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
        }
        function classifyNews(title, fallback) {
            const text = title.toLowerCase();
            if (/paper|论文|arxiv|research|研究/.test(text)) return '论文研究';
            if (/open|开源|model|模型|hugging/.test(text)) return '开源模型';
            if (/github|developer|开发|code/.test(text)) return '开发趋势';
            return fallback || 'AI动态';
        }
        function getNewsInsight(item) {
            const insights = {
                '开源模型': ['开源模型会直接影响开发者的选型、部署成本和二次开发方式。', '关注模型许可证、推理显存、量化效果和社区活跃度。'],
                '论文研究': ['论文中的方法可能成为下一阶段模型能力或评测方式的基础。', '重点看方法是否有公开代码、可复现实验和真实业务收益。'],
                '产品发布': ['产品发布通常意味着模型能力正在进入更具体的使用场景。', '关注 API 稳定性、价格、延迟、数据隐私和迁移成本。'],
                '开发趋势': ['开发工具的变化会影响 AI 应用的工程效率和交付方式。', '关注是否能减少重复工作，以及对现有开发流程的兼容性。']
            };
            return insights[item.category] || ['这条信息反映了 AI 领域近期的技术或产品变化。', '建议结合自己的学习方向，判断它是否值得跟进或实践。'];
        }
        function normalizeNews(item, feed) {
            const title = String(item.title || '').trim();
            return { title, summary: String(item.description || item.content || '').replace(/<[^>]*>/g, '').trim().slice(0, 180), source: feed.name, category: classifyNews(title, feed.category), publishedAt: item.pubDate || new Date().toISOString(), url: safeHttpUrl(item.link) };
        }
        function safeHttpUrl(value) {
            try {
                const url = new URL(String(value || ''));
                return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '#';
            } catch { return '#'; }
        }
        function formatUpdatedAt(value) {
            if (!value) return '尚未刷新';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '时间未知' : date.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        function isNewsInTimeRange(item) {
            if (growthState.trendTime === 'all') return true;
            const published = new Date(item.publishedAt).getTime();
            if (Number.isNaN(published)) return false;
            const hours = growthState.trendTime === 'day' ? 24 : 24 * 7;
            return Date.now() - published <= hours * 60 * 60 * 1000;
        }
        function dedupeNews(items) {
            const seen = new Set();
            return items.filter(item => {
                const key = item.title.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '').slice(0, 100);
                if (!key || seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }
        async function refreshNews() {
            if (newsState.loading) return;
            newsState.loading = true;
            newsState.error = '';
            newsState.failedSources = [];
            renderGrowth();
            try {
                const results = await Promise.all(NEWS_FEEDS.map(async feed => {
                    try {
                        const endpoint = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url);
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 12000);
                        const response = await fetch(endpoint, { cache: 'no-store', signal: controller.signal });
                        clearTimeout(timeout);
                        if (!response.ok) return [];
                        const data = await response.json();
                        return (data.items || []).slice(0, 8).map(item => normalizeNews(item, feed));
                    } catch { newsState.failedSources.push(feed.name); return []; }
                }));
                const items = dedupeNews(results.flat().filter(item => item.title)).sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt)).slice(0, 30);
                if (!items.length) throw new Error('empty feed');
                newsState.items = items;
                newsState.updatedAt = new Date().toISOString();
                Store.set(NEWS_CACHE_KEY, items);
                Store.set('aiNewsUpdatedAt', newsState.updatedAt);
            } catch {
                newsState.error = '实时源暂时不可用，当前显示缓存内容';
            } finally {
                newsState.loading = false;
                newsState.loaded = true;
                if (newsState.failedSources.length && newsState.items.length) {
                    newsState.error = `${newsState.failedSources.length} 个来源暂时不可用，已显示其他内容`;
                }
                renderGrowth();
            }
        }
        window.openNewsTab = function() {
            growthState.subTab = 'hot';
            renderGrowth();
            if (!newsState.loaded) refreshNews();
        };
        window.openTrendInterview = function() {
            growthState.subTab = 'live';
            renderGrowth();
            if (!newsState.loaded) refreshNews();
        };
        function renderNews() {
            const categories = ['全部', ...new Set(newsState.items.map(item => item.category))];
            const items = newsState.items.filter(item => {
                if (growthState.trendFilter !== '全部' && item.category !== growthState.trendFilter) return false;
                if (!isNewsInTimeRange(item)) return false;
                const key = item.url || item.title;
                if (growthState.trendView === 'unread' && newsMarks.read[key]) return false;
                if (growthState.trendView === 'saved' && !newsMarks.saved[key]) return false;
                return true;
            });
            return `
                <div class="trend-toolbar">
                    <span class="trend-status">${newsState.loading ? '正在刷新...' : newsState.error || `最近 ${items.length} 条 · 更新于 ${formatUpdatedAt(newsState.updatedAt)}`}</span>
                    <button class="trend-refresh" onclick="refreshNews()" ${newsState.loading ? 'disabled' : ''}>↻ 刷新</button>
                </div>
                <div class="filter-tabs">${['全部', '未读', '收藏'].map((view, index) => `<button class="filter-btn ${growthState.trendView === ['all', 'unread', 'saved'][index] ? 'active' : ''}" onclick="growthState.trendView='${['all', 'unread', 'saved'][index]}';renderGrowth();">${view}</button>`).join('')}</div>
                <div class="filter-tabs">${[['all', '全部时间'], ['day', '24小时'], ['week', '7天']].map(([value, label]) => `<button class="filter-btn ${growthState.trendTime === value ? 'active' : ''}" onclick="growthState.trendTime='${value}';renderGrowth();">${label}</button>`).join('')}</div>
                <div class="filter-tabs">${categories.map(category => `<button class="filter-btn ${growthState.trendFilter === category ? 'active' : ''}" onclick="growthState.trendFilter='${escapeHTML(category)}';renderGrowth();">${escapeHTML(category)}</button>`).join('')}</div>
                ${items.map(item => { const index = newsState.items.indexOf(item); const key = item.url || item.title; const insight = getNewsInsight(item); return `<article class="trend-card"><div class="trend-meta"><span>${escapeHTML(item.source)}</span><span>${formatNewsDate(item.publishedAt)}</span></div><h3><a href="${escapeHTML(item.url)}" target="_blank" rel="noopener noreferrer" onclick="markNewsRead(${index})">${escapeHTML(item.title)}</a></h3><p>${escapeHTML(item.summary || '点击查看原文')}</p><div class="trend-insight"><strong>为什么重要：</strong>${escapeHTML(insight[0])}<br><strong>建议关注：</strong>${escapeHTML(insight[1])}</div><div class="trend-tags"><span class="trend-tag">${escapeHTML(item.category)}</span><span class="trend-tag">时事</span></div><div class="trend-actions"><button class="${newsMarks.read[key] ? 'active' : ''}" onclick="toggleNewsMark(${index}, 'read')">${newsMarks.read[key] ? '✓ 已读' : '标记已读'}</button><button class="${newsMarks.saved[key] ? 'active' : ''}" onclick="toggleNewsMark(${index}, 'saved')">${newsMarks.saved[key] ? '★ 已收藏' : '☆ 收藏'}</button></div></article>`; }).join('')}
                ${!items.length ? '<p class="empty-tip">暂时没有匹配的热点</p>' : ''}
            `;
        }
        function buildTrendQuestions() {
            const templates = [
                ['理解题', '算法工程师', '这条新闻的核心变化是什么？它解决了什么问题？', '先说明背景、变化和直接影响，再指出它与既有方案的差异。'],
                ['系统设计题', '大模型应用', '如果把这项能力落地为产品，你会如何设计技术架构？', '从数据流、模型选择、服务接口、评测指标、成本和降级方案说明取舍。'],
                ['工程追问题', '后端开发', '上线后效果或延迟不达标，你会怎样定位和优化？', '按数据、模型、推理服务和业务指标分层排查，并设计可复现的实验。'],
                ['产品分析题', 'AI产品经理', '这项更新对用户和产品路线有什么影响？你会如何验证需求？', '从目标用户、使用场景、核心指标、风险和迭代优先级说明判断依据。']
            ];
            return newsState.items.slice(0, 8).flatMap((item, index) => templates.map((template, typeIndex) => ({
                id: `trend-${index}-${typeIndex}`, category: item.category, type: template[0], role: template[1], difficulty: typeIndex === 1 ? '困难' : typeIndex === 0 ? '简单' : '中等', question: `围绕「${item.title}」：${template[2]}`, answer: template[3], source: item
            })));
        }

        function renderGrowth() {
            const el = document.getElementById('growth-content');
            const cats = ['全部', ...new Set(questions.map(q => q.category))];
            const trendQuestions = buildTrendQuestions();
            const filtered = questions.filter(q => {
                if (growthState.selectedCategory !== '全部' && q.category !== growthState.selectedCategory) return false;
                if (growthState.searchKeyword.trim()) {
                    const kw = growthState.searchKeyword.toLowerCase();
                    if (!q.question.toLowerCase().includes(kw) && !q.answer.toLowerCase().includes(kw)) return false;
                }
                return true;
            });
            const errors = Store.get('errors', []);
            let contentHTML = '';

            if (growthState.subTab === 'interview') {
                if (growthState.mode === 'browse') {
                    contentHTML = `
                        <div class="search-box"><input class="search-input" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--bg);color:var(--text);" placeholder="🔍 搜索面试题..." value="${growthState.searchKeyword}" oninput="growthSearch(this.value)"/></div>
                        <div class="filter-tabs">${cats.map(c => `<button class="filter-btn ${growthState.selectedCategory===c?'active':''}" onclick="growthFilter('${c}')">${c}</button>`).join('')}</div>
                        ${filtered.map(q => `
                            <div class="question-item" onclick="toggleAnswer(${q.id})">
                                <div><span class="q-category">${q.category}</span><span class="q-difficulty ${q.difficulty}">${q.difficulty}</span></div>
                                <p class="q-text">${q.question}</p>
                                ${growthState.expandedId === q.id ? `<p class="q-answer">${q.answer}</p>` : ''}
                                <span class="q-toggle">${growthState.expandedId === q.id ? '收起' : '展开答案'}</span>
                            </div>
                        `).join('')}
                        ${filtered.length === 0 ? '<p class="empty-tip">😅 没有找到匹配的题目</p>' : ''}
                        <button class="btn-start-exam" onclick="startExam()">🎯 AI模拟面试（5题）</button>
                    `;
                } else if (growthState.mode === 'exam') {
                    if (!growthState.examStarted) {
                        contentHTML = `
                            <div style="text-align:center;padding:20px 0;">
                                <p style="color:var(--text);">🎯 将随机抽取 <strong>5道题</strong> 进行模拟面试</p>
                                <p style="font-size:13px;color:var(--text-secondary);margin:6px 0;">看完题目后点击「显示答案」对照，自行判断是否掌握</p>
                                <button class="btn-start-exam" onclick="startExam()">🚀 开始面试</button>
                                <button style="margin-top:10px;padding:6px 20px;border:1px solid var(--border);border-radius:16px;background:var(--card-bg);cursor:pointer;font-size:13px;color:var(--text);" onclick="growthState.mode='browse';renderGrowth();">📖 返回浏览</button>
                            </div>
                        `;
                    } else if (!growthState.examFinished) {
                        const q = growthState.examQuestions[growthState.currentIndex] || {};
                        contentHTML = `
                            <div class="exam-header"><span>第 ${growthState.currentIndex+1} / 5 题</span><span>✅ ${growthState.correctCount} 正确 | ❌ ${growthState.wrongCount} 错误</span></div>
                            <div class="exam-question">
                                <div><span class="q-category">${q.category||''}</span><span class="q-difficulty ${q.difficulty||''}">${q.difficulty||''}</span></div>
                                <p class="q-text">${q.question||''}</p>
                                ${growthState.showAnswer ? `
                                    <p class="q-answer">${q.answer||''}</p>
                                    <div class="exam-actions"><button class="btn-correct" onclick="markCorrect()">✅ 已掌握</button><button class="btn-wrong" onclick="markWrong()">❌ 加入错题</button></div>
                                ` : `<button class="btn-show-answer" onclick="growthState.showAnswer=true;renderGrowth();">👁️ 显示答案（自我判断）</button>`}
                            </div>
                        `;
                    } else {
                        const rate = Math.round((growthState.correctCount / 5) * 100);
                        contentHTML = `
                            <div class="exam-result">
                                <h3>📊 面试完成！</h3>
                                <div class="result-stats">
                                    <div class="stat-circle correct"><span>${growthState.correctCount}</span><label>掌握</label></div>
                                    <div class="stat-circle wrong"><span>${growthState.wrongCount}</span><label>待复习</label></div>
                                    <div class="stat-circle rate"><span>${rate}%</span><label>正确率</label></div>
                                </div>
                                ${growthState.wrongQuestions.length > 0 ? `
                                    <div style="text-align:left;background:var(--bg);border-radius:10px;padding:12px;margin:12px 0;">
                                        <p style="font-weight:600;font-size:13px;color:var(--text);">📝 以下题目已自动加入「易错考点」：</p>
                                        ${growthState.wrongQuestions.map(q => `<div style="padding:3px 0;font-size:13px;color:var(--text-secondary);">${q.question}</div>`).join('')}
                                    </div>
                                ` : ''}
                                <button class="btn-retry" onclick="resetExam()">🔄 再来一次</button>
                                <button class="btn-back" onclick="growthState.mode='browse';renderGrowth();">📖 返回浏览</button>
                            </div>
                        `;
                    }
                }
            }

            if (growthState.subTab === 'hot') {
                contentHTML = `<div style="padding:4px 0;"><p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">📡 聚合官方博客、开源社区和论文源，内容缓存在本地</p>${renderNews()}</div>`;
            }

            if (growthState.subTab === 'live') {
                const trendRoles = ['全部岗位', ...new Set(trendQuestions.map(q => q.role))];
                const trendTypes = ['全部题型', ...new Set(trendQuestions.map(q => q.type))];
                const filteredTrendQuestions = trendQuestions.filter(q => (growthState.trendRole === '全部岗位' || q.role === growthState.trendRole) && (growthState.trendType === '全部题型' || q.type === growthState.trendType));
                contentHTML = `
                    <div style="padding:4px 0;">
                        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">💼 根据最新 AI 热点生成场景题，回答后可加入易错考点</p>
                        <div class="filter-tabs">${trendRoles.map(role => `<button class="filter-btn ${growthState.trendRole === role ? 'active' : ''}" onclick="growthState.trendRole='${escapeHTML(role)}';renderGrowth();">${escapeHTML(role)}</button>`).join('')}</div>
                        <div class="filter-tabs">${trendTypes.map(type => `<button class="filter-btn ${growthState.trendType === type ? 'active' : ''}" onclick="growthState.trendType='${escapeHTML(type)}';renderGrowth();">${escapeHTML(type)}</button>`).join('')}</div>
                        ${filteredTrendQuestions.map(q => `<div class="trend-question"><div><span class="q-category">${escapeHTML(q.role)}</span><span class="q-difficulty ${q.difficulty}">${q.difficulty}</span><span class="trend-tag">${escapeHTML(q.type)}</span></div><p class="q-text">${escapeHTML(q.question)}</p><p class="q-answer">${escapeHTML(q.answer)}</p><div class="q-source">来源：<a href="${escapeHTML(q.source.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(q.source.title)}</a></div><div class="trend-actions"><button class="${trendMastery[q.id] ? 'active' : ''}" onclick="toggleTrendMastery('${escapeHTML(q.id)}')">${trendMastery[q.id] ? '✓ 已掌握' : '标记掌握'}</button><button onclick="addTrendErrorById('${escapeHTML(q.id)}')">加入错题</button></div></div>`).join('')}
                        ${!filteredTrendQuestions.length ? '<p class="empty-tip">暂无匹配题目，请调整筛选条件</p>' : ''}
                        <button class="btn-start-exam" onclick="startExam()">🎯 热点模拟面试（5题）</button>
                    </div>
                `;
            }

            if (growthState.subTab === 'error') {
                const filteredErrors = errors.filter(e => {
                    if (growthState.errorFilter === 'needReview' && e.mastered) return false;

        };
        window.toggleNewsMark = function(index, type) {
            const item = newsState.items[index];
            if (!item) return;

            newsMarks[type][key] = !newsMarks[type][key];
            Store.set('aiNewsMarks', newsMarks);
            renderGrowth();
        };
        window.addTrendError = function(index) {
            const question = buildTrendQuestions()[index];
            if (!question) return;
            const errors = Store.get('errors', []);
            if (!errors.some(error => error.text === question.question)) {
                errors.push({ text: question.question, mastered: false, category: question.category });
                Store.set('errors', errors);
            }
            alert('已加入易错考点');
        };
        window.addTrendErrorById = function(id) {
            const question = buildTrendQuestions().find(item => item.id === id);
            if (!question) return;
            const errors = Store.get('errors', []);
            if (!errors.some(error => error.text === question.question)) {
                errors.push({ text: question.question, mastered: false, category: question.category });
                Store.set('errors', errors);
            }
            alert('已加入易错考点');
        };
        window.toggleTrendMastery = function(id) {
            trendMastery[id] = !trendMastery[id];
            Store.set('aiTrendMastery', trendMastery);
            renderGrowth();
        };
        window.startExam = function() {
            const sourceQuestions = growthState.subTab === 'live' ? buildTrendQuestions() : questions;
            const pool = sourceQuestions.filter(q => {
                const categoryFilter = growthState.subTab === 'live' ? growthState.trendFilter : growthState.selectedCategory;
                if (categoryFilter !== '全部' && q.category !== categoryFilter) return false;
                if (growthState.subTab === 'live' && growthState.trendRole !== '全部岗位' && q.role !== growthState.trendRole) return false;
                if (growthState.subTab === 'live' && growthState.trendType !== '全部题型' && q.type !== growthState.trendType) return false;
                if (growthState.subTab !== 'live' && growthState.searchKeyword.trim()) {
                    const kw = growthState.searchKeyword.toLowerCase();
                    if (!q.question.toLowerCase().includes(kw)) return false;
                }
                return true;
            });
            if (pool.length === 0) { alert('当前分类下没有题目'); return; }
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            growthState.examQuestions = shuffled.slice(0, 5);
            growthState.currentIndex = 0;
            growthState.correctCount = 0;
            growthState.wrongCount = 0;
            growthState.wrongQuestions = [];
            growthState.showAnswer = false;
            growthState.examStarted = true;
            growthState.examFinished = false;
            growthState.mode = 'exam';
            renderGrowth();
        };
        window.markCorrect = function() {
            const question = growthState.examQuestions[growthState.currentIndex];
            if (question && question.id) {
                trendMastery[question.id] = true;
                Store.set('aiTrendMastery', trendMastery);
            }
            growthState.correctCount++;
            nextQuestion(); };
        window.markWrong = function() {
            growthState.wrongCount++;
            const q = growthState.examQuestions[growthState.currentIndex];
            if (q && q.id) {
                trendMastery[q.id] = false;
                Store.set('aiTrendMastery', trendMastery);
            }
            growthState.wrongQuestions.push(q);
            const errors = Store.get('errors', []);
            if (!errors.some(e => e.text === q.question)) {
                errors.push({ text: q.question, mastered: false, category: q.category || '未分类' });
                Store.set('errors', errors);
            }
            nextQuestion();
        };

        function nextQuestion() {
            growthState.showAnswer = false;
            if (growthState.currentIndex + 1 < growthState.examQuestions.length) { growthState.currentIndex++;
                renderGrowth(); } else { growthState.examFinished = true;
                renderGrowth(); }
        }
        window.resetExam = function() {
            growthState.examStarted = false;
            growthState.examFinished = false;
            growthState.examQuestions = [];
            growthState.currentIndex = 0;
            growthState.correctCount = 0;
            growthState.wrongCount = 0;
            growthState.wrongQuestions = [];
            growthState.showAnswer = false;
            growthState.mode = 'exam';
            renderGrowth();
        };

            const input = document.getElementById('newErrorInput');
            const cat = document.getElementById('newErrorCat');
            if (!input.value.trim()) { alert('请输入错题内容'); return; }
            const errors = Store.get('errors', []);
            errors.push({ text: input.value.trim(), mastered: false, category: cat.value });
            Store.set('errors', errors);
            input.value = '';
            renderGrowth();
        };
        window.toggleErrorStatus = function(i) {
            const errors = Store.get('errors', []);
            errors[i].mastered = !errors[i].mastered;

            renderGrowth();
        };

                    </div>
                    <div style="flex:1;background:var(--card-bg);border-radius:10px;padding:12px;text-align:center;box-shadow:0 2px 8px var(--shadow);">
                        <span style="font-size:20px;font-weight:700;display:block;color:var(--primary);">${rate}%</span>
                        <label style="font-size:11px;color:var(--text-secondary);">掌握率</label>
                    </div>
                </div>

                <div class="insight-card">
                    <h3>📈 近7天完成率趋势</h3>
                    <svg viewBox="0 0 320 120" class="chart-svg">
                        <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
                        ${weekData.map((d,i) => {
                            const x = pad2 + i*stp, y = pad2 + h2 - (d.value/maxV)*h2;
                            return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--primary)"/>`;
                        }).join('')}
                        ${weekData.map((d,i) => {
                            const x = pad2 + i*stp;
                            return `<text x="${x}" y="115" font-size="9" fill="var(--text-secondary)" text-anchor="middle">${d.label}</text>`;
                        }).join('')}
                        <text x="15" y="20" font-size="9" fill="var(--text-secondary)">${maxV}%</text>
                    </svg>
                </div>

                <div class="insight-card">
                    <h3>🎯 知识点掌握率</h3>
                    <div style="display:flex;justify-content:center;padding:6px 0;">
                        <svg viewBox="0 0 140 140" style="width:140px;height:140px;">
                            <circle cx="70" cy="70" r="48" fill="none" stroke="var(--bg)" stroke-width="16"/>
                            <circle cx="70" cy="70" r="48" fill="none" stroke="${rate>60?'var(--success)':rate>30?'#ffc107':'var(--danger)'}" stroke-width="16" stroke-dasharray="${dash} ${circumference}" stroke-linecap="round" transform="rotate(-90 70 70)"/>
                            <text x="70" y="66" font-size="18" font-weight="700" fill="var(--text)" text-anchor="middle">${rate}%</text>
                            <text x="70" y="88" font-size="11" fill="var(--text-secondary)" text-anchor="middle">掌握率</text>
                        </svg>
                    </div>
                </div>

                <div class="insight-card">
                    <h3>📊 错题分类统计</h3>
                    ${(() => {

                        const counts = cats.map(c => errors.filter(e => (e.category||'其他') === c).length);
                        const maxC = Math.max(...counts, 1);
                        const pad3=12, w3=280, h3=90;
                        const bw = w3/cats.length*0.5;
                        const gap = (w3 - bw*cats.length)/(cats.length+1);
                        return `<svg viewBox="0 0 320 120" class="chart-svg">
                            ${cats.map((c,i) => {
                                const bh = (counts[i]/maxC)*h3;
                                const x = pad3 + gap + i*(bw+gap);
                                const y = pad3 + h3 - bh;
                                return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="var(--danger)" rx="3"/>`;
                            }).join('')}
                            ${cats.map((c,i) => {
                                const x = pad3 + gap + i*(bw+gap) + bw/2;
                                return `<text x="${x}" y="115" font-size="9" fill="var(--text-secondary)" text-anchor="middle">${c.length>2?c.slice(0,2):c}</text>`;

                reviews: Store.get('reviews', {}),
                records: Store.get('records', {}),
                taskNotes: Store.get('taskNotes', {}),
                continuousDays: Store.get('continuousDays', 0),
                lastDate: Store.get('lastDate', ''),
                settings: { darkMode: settings.darkMode, fontSize: settings.fontSize },
                exportTime: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '学习工作台备份_' + getToday() + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('✅ 数据导出成功！');
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.currentDayIndex !== undefined) { homeState.currentDayIndex = data.currentDayIndex;
                        Store.set('currentDayIndex', homeState.currentDayIndex); }
                    if (data.plan) { homeState.plan = data.plan;
                        Store.set('plan', homeState.plan); }
                    if (data.errors) Store.set('errors', data.errors);
                    if (data.reviews) Store.set('reviews', data.reviews);
                    if (data.records) Store.set('records', data.records);
                    if (data.taskNotes) { taskNotes = data.taskNotes;
                        Store.set('taskNotes', taskNotes); }
                    if (data.continuousDays !== undefined) Store.set('continuousDays', data.continuousDays);
                    if (data.lastDate !== undefined) Store.set('lastDate', data.lastDate);
                    if (data.settings) {
                        if (data.settings.darkMode !== undefined) { settings.darkMode = data.settings.darkMode;
                            Store.set('darkMode', settings.darkMode); }
                        if (data.settings.fontSize !== undefined) { settings.fontSize = data.settings.fontSize;
                            Store.set('fontSize', settings.fontSize); }
                        applySettings();
                    }
                    alert('✅ 数据导入成功！刷新页面查看效果');
                    location.reload();
                } catch (err) { alert('❌ 数据格式错误，请检查备份文件'); }
            };
            reader.readAsText(file);
            document.getElementById('importFile').value = '';
        };

        // ============================================================
        // 初始化
        // ============================================================
        if (Store.get('errors', []).length === 0) {
            Store.set('errors', [
                { text: '过拟合与欠拟合', mastered: false, category: '机器学习' },
                { text: '梯度消失/爆炸', mastered: false, category: '深度学习' },
                { text: '学习率调度策略', mastered: false, category: '深度学习' }
            ]);
            homeState.errors = Store.get('errors');
        }
        if (Object.keys(Store.get('reviews', {})).length === 0) {
            const today = getToday();
            homeState.reviews[today] =
                '今天是学习AI的第1天，了解了机器学习的基本概念。\n监督学习和无监督学习的区别是：监督学习有标签，无监督学习没有标签。\n还学习了用NumPy进行数据加载和可视化。';
            Store.set('reviews', homeState.reviews);
        }

        renderHome();
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
        console.log('✅ AI学习工作台已启动（完整130天计划+学习报告）');
        console.log('📊 当前进度：第', homeState.currentDayIndex + 1, '/', homeState.plan.length, '天');
        console.log('💾 可在「我的」页面导出备份');
    </script>
</body>
</html>
